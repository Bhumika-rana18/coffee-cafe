<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Cafe | Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="cart.js"></script>
<script src="search.js"></script>
<style>
body{
    background:#b07d5a;
}

.cart-box{
    background:#fff;
    border-radius:10px;
    padding:20px;
    margin-top:40px;
}

table{
    text-align:center;
}

img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}
</style>

</head>

<body>

<div class="container">

<div class="cart-box">

<h2 class="text-center mb-4">🛒 My Cart</h2>

<table class="table table-bordered table-striped">

<thead>

<tr>

<th>Coffee</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Action</th>

</tr>

</thead>

<tbody id="cartBody">

</tbody>

</table>

<div class="text-end">

<h4>

Grand Total :
₹ <span id="grandTotal">0</span>

</h4>

<a href="checkout.html" class="btn btn-success">

Proceed To Checkout

</a>

</div>

</div>

</div>


</body>
</html>
